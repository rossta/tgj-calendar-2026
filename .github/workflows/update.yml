name: Update TGJ Calendar Feeds

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    name: Update TGJ Calendar Feeds

    steps:
      - uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Install gems
        run: bundle install

      - name: Generate calendar feeds
        run: bin/generate_tgj_calendar

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add feeds/tgj.ics feeds/tgj.webcal
          git diff --cached --quiet || git commit -m "Auto-update TGJ calendar feeds"
          git push
