name: Ruby

on:
  push:
    branches:
      - main

  pull_request:

permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    name: Main

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - name: Run the default task
        run: bundle exec rake

      - name: Generate calendar feeds
        run: bin/generate_tgj_calendar

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add feeds/tgj.ics feeds/tgj.webcal
          git diff --cached --quiet || git commit -m "Auto-update TGJ calendar feeds"
          git push
